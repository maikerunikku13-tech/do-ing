<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wakatteTVへずまりゅう</title>
  <style>
    body{
  height:100vh;
  display:grid;
  place-items:center;
  margin:0;
  background-image: url("https://i.ytimg.com/vi/qZ3v1NjfIFA/hqdefault.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    }

    /* 再生ボタン（見た目は固定） */
    .play-btn{
      width:78px;
      height:78px;
      border-radius:999px;
      background: rgba(17,24,39,.92);
      box-shadow: 0 16px 35px rgba(0,0,0,.42);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      text-decoration:none;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      position:relative;
      z-index:1;
      border:none;
      outline:none;
    }

    /* ホバー/押し込みだけ */
    .play-btn:hover{
      transform: translateY(-3px) scale(1.02);
      background: rgba(11,18,32,.96);
    }
    .play-btn:active{
      transform: translateY(2px) scale(.98);
    }

    /* ▶マーク */
    .icon{
      width:0;height:0;
      border-left:18px solid #fff;
      border-top:11px solid transparent;
      border-bottom:11px solid transparent;
      margin-left:3px;
      opacity:.95;
    }

    .play-btn:focus-visible{
      box-shadow: 0 0 0 3px rgba(255,255,255,.22), 0 22px 55px rgba(0,0,0,.52);
    }
  </style>
</head>
<body>

  <button id="playBtn" class="play-btn" type="button" aria-label="再生" title="再生">
    <span class="icon" aria-hidden="true"></span>
  </button>

  <script>
    const tiktokUrl = "https://lite.tiktok.com/t/ZS9BgqXk8VMtD-uPfK9/";
    const btn = document.getElementById("playBtn");

    btn.addEventListener("click", () => {
      const next = !btn.classList.contains("is-playing");
      btn.classList.toggle("is-playing", next);

      // 見た目は固定（▶は変えない）で、aria-labelだけ切替
      btn.setAttribute("aria-label", next ? "再生中" : "再生");

      // ONにしたときだけTikTokを新規タブで開く（OFFでは開かない）
      if (next) {
        window.open(tiktokUrl, "_blank", "noopener,noreferrer");
      }
    });
  </script>

</body>
</html>
