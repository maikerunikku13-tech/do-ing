<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wakatteTVへずまりゅう</title>
  <style>
    body{
  height:100vh;
  display:grid;
  place-items:center;
  margin:0;
  background-image: url("https://i.ytimg.com/vi/qZ3v1NjfIFA/hqdefault.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    }

 .play-btn{
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 86px;
  height: 86px;
  border-radius: 999px;
  background: rgba(0,0,0,0.45);      /* 背景に馴染む半透明 */
  backdrop-filter: blur(4px);       /* ぼかし（対応ブラウザのみ） */
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

.tri{
  width: 0;
  height: 0;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-left: 22px solid rgba(255,255,255,0.95); /* ▶ */
  margin-left: 6px; /* 見た目調整 */
}

/* ON（再生中）っぽい見た目 */
.play-btn.is-playing{
  background: rgba(30, 255, 120, 0.18);
  border-color: rgba(30, 255, 120, 0.6);
}
.play-btn.is-playing .tri{
  border-left-color: rgba(30, 255, 120, 0.95);
}
  </style>
</head>
<body>

  <button id="playBtn" class="play-btn" type="button" aria-label="再生" title="再生">
    <span class="icon" aria-hidden="true"></span>
  </button>

  <script>
    const tiktokUrl = "https://lite.tiktok.com/t/ZS9BgqXk8VMtD-uPfK9/";
    const btn = document.getElementById("playBtn");

    btn.addEventListener("click", () => {
      const next = !btn.classList.contains("is-playing");
      btn.classList.toggle("is-playing", next);

      // 見た目は固定（▶は変えない）で、aria-labelだけ切替
      btn.setAttribute("aria-label", next ? "再生中" : "再生");

      // ONにしたときだけTikTokを新規タブで開く（OFFでは開かない）
      if (next) {
        window.open(tiktokUrl, "_blank", "noopener,noreferrer");
      }
    });
  </script>

</body>
</html>
