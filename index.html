<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ふーみんが大人の対応</title>
  <style>
    body{
  height:100vh;
  display:grid;
  place-items:center;
  margin:0;
  background-image: url("https://i.ytimg.com/vi/qZ3v1NjfIFA/hqdefault.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    }
   /* 再生ボタン（画像寄せ） */
.play-btn{
  width:78px;
  height:78px;
  border-radius:999px;

  /* 背景 */
  background: radial-gradient(circle at 35% 30%,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.05) 18%,
    rgba(0,0,0,.35) 55%,
    rgba(0,0,0,.55) 100%);

  /* ガラス感（効かない環境もある） */
  backdrop-filter: blur(8px);

  /* 外周の縁 + 影 */
  box-shadow:
    0 14px 32px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.10),
    inset 0 -10px 22px rgba(0,0,0,.35);

  display:grid;
  place-items:center;
  cursor:pointer;
  user-select:none;
  text-decoration:none;

  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  position:relative;
  z-index:1;

  border:none;
  outline:none;
}

/* 外周の“光る輪”っぽいのを控えめに追加 */
.play-btn::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:999px;
  background: radial-gradient(circle at 30% 25%,
    rgba(255,255,255,.18),
    rgba(255,255,255,0) 60%);
  pointer-events:none;
  opacity:.9;
}

/* ▶アイコン */
.icon{
  width:0;
  height:0;
  border-left:20px solid rgba(255,255,255,.98);
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  margin-left:4px;

  /* ちょい立体感 */
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

/* ホバー：ふわっと持ち上げ + 焦点 */
.play-btn:hover{
  transform: translateY(-3px) scale(1.02);
  filter: brightness(1.03);
  box-shadow:
    0 18px 40px rgba(0,0,0,.50),
    inset 0 0 0 1px rgba(255,255,255,.12),
    inset 0 -10px 22px rgba(0,0,0,.35);
}

/* 押した時：沈み（沈む距離=2pxくらいにしたいなら2に） */
.play-btn:active{
  transform: translateY(2px) scale(.98);
}
  </style>
</head>
<body>
  <!-- A → Bへ（同フォルダ） -->
  <a class="play-btn" href="./2.html" target="_self" aria-label="次へ" role="button">
    <span class="icon" aria-hidden="true"></span>
  </a>
</body>
</html>
